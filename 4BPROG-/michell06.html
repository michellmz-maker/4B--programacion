<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #E4DAE3;
        }

        .pokeImg{
            width: 250px;
            height: 250px;
            position: absolute;
            top: 150px;
            left: 100px;
            mix-blend-mode: multiply;
        }

        button{
            width: 50px;
            height: 50px;
            background-color: #E4DAE3;
            border-color: grey;
            border-radius: 10px;
            position: absolute;
            top: 440px;
            left: 330px;
        }

        .placeholder{
            width: 120px;
            height: 80px;
            position: absolute;
            top: 400px;
            left: 150px;
            font-family: Georgia,'Times New Roman', Times, serif;
            font-size: 20px;
            background-color: rgb(218,178,255);
        }

        .pokeImg1 {
            
            left: 100px;
        }
    </style>
</head>
<body>

    <img src="img-2.jpg" width="1500">
    <input type="text" placeholder="Pikachu" id="pokeName" class="placeholder">
    <img src="pokebola.jpg" alt="pokebola" id="pokeImg" class="pokeImg">

    <!-- Usa IDs únicos -->
    <div id="pokename" class="pokeimg1">Nombre</div>
    <div id="pokeHe" class="pokeimg1">Altura</div>
    <div id="pokeWe" class="pokeimg1">Peso</div>

    <div id="pokeitem" class="pokeimg1" style="left: 700px; top: 1800px;">Item: </div>
    <div id="pokeorder" class="pokeimg1" style="left: 300px; top: 1800px;">Order: </div>
    <div id="pokeid" class="pokeimg1" style="left: 300px; top: 1800px;">Id: </div>
    <div id="pokemove1" class="pokeimg1" style="left: 800px; top: 220px;">Movimiento 1: </div>
    <div id="pokemove2" class="pokeimg1" style="left: 700px; top: 300px;">Movimiento 2: </div>
    <div id="pokemove3" class="pokeimg1" style="left: 700px; top: 270px;">Movimiento 3: </div>
    <div id="pokemove4" class="pokeimg1" style="left: 700px; top: 300px;">Movimiento 4: </div>
    <button onclick="fetchPokemon()" class="button"></button>

    <div class="grafica">
        <canvas id="miCanvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const fetchPokemon = () => {
            const pokeNameInput = document.getElementById("pokeName");
            let pokeName = pokeNameInput.value;
            pokeName = pokeName.toLowerCase();
            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;

            fetch(url).then((res) => {
                if (res.status != "200") {
                    console.log(res);
                } else {
                    return res.json();
                }
            }).then((data) => {
                if (data) {
                    console.log(data);

                    let pokeImg = data.sprites.front_default;
                    document.getElementById("pokeImg").src = pokeImg;
let name = document.getElementById('pokename');
                    name.innerHTML = `Nombre: ${data.forms[0].name}`;

                    let element1 = document.getElementById('pokeHe');
                    element1.innerHTML = `Altura: ${data.height}`;

                    let element2 = document.getElementById('pokeWe');
                    element2.innerHTML = `Peso: ${data.weight}`;

                    let element3 = document.getElementById('pokeorder');
                    element3.innerHTML = `Order: ${data.order}`;

                    let element4 = document.getElementById('pokeid');
                    element4.innerHTML = `Id: ${data.id}`;  

                    let element5 = document.getElementById('pokeitem');
                    element5.innerHTML = `Item: ${data.abilities[0].ability.name}`;

                    let element6 = document.getElementById('poketype');
                    if (element6) element6.innerHTML = `Type: ${data.types[0].type.name}`;

                    let element7 = document.getElementById('pokemove1');
                    element7.innerHTML = `Move 1: ${data.moves[0].move.name}`;

                    let element8 = document.getElementById('pokemove2');
                    element8.innerHTML = `Move 2: ${data.moves[1].move.name}`;

                    let element9 = document.getElementById('pokemove3');
                    element9.innerHTML = `Move 3: ${data.moves[2].move.name}`;

                    let element10 = document.getElementById('pokemove4');
                    element10.innerHTML = `Move 4: ${data.moves[3].move.name}`;

                    const miCanvas = document.getElementById('miCanvas').getContext("2d");
                    if (window.miCanva != undefined) 
                        window.miCanva.destroy();
                    window.miCanva = new Chart(miCanvas, {
                        type: "bar",
                        data: {
                            labels: ["HP", "Attack", "Defense", "Special-A", "Special-D", "Speed"],
                            datasets: [{
                                label: `${data.forms[0].name}`,
                                data: [
                                    data.stats[0].base_stat,
                                    data.stats[1].base_stat,
                                    data.stats[2].base_stat,
                                    data.stats[3].base_stat,
                                    data.stats[4].base_stat,
                                    data.stats[5].base_stat
                                ],
                                borderColor: [
                                    'rgba(255, 99, 132, 0.2)',
                                    'rgba(54, 162, 235, 0.2)',
                                    'rgba(255, 206, 86, 0.2)',
                                    'rgba(75, 192, 192, 0.2)',
                                    'rgba(153, 102, 255, 0.2)',
                                    'rgba(255, 159, 64, 0.2)'
                                ],
                                background: [
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)',
                                    'rgba(255, 159, 64, 1)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                x: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            });
        }
    </script>

</body>
</html>
